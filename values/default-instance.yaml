---
# Your settings. They win over the defaults of civitas-core-deployment and the addons.
global:
  domain: civitas.test
  # Used as Kubernetes namespace and as Keycloak realm.
  instanceSlug: dev
  # This user is NiFi admin. See `just create-admin-user`.
  initialUserEmail: admin@civitas.test
  profile: development
  serviceMesh:
    enable: false
  runtimePolicies:
    enabled: false
  ingress:
    clusterIssuer: selfsigned-ca
    ingressClass: nginx

kafka:
  cluster:
    productVersion: "4.2.1"

nifi:
  nifi:
    productVersion: "2.9.0"
    ingress:
      # Show the NiFi web page at https://nifi.<domain>
      enabled: true
