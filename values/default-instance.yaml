---
# Overrides civitas-core-deployment's defaults/environment/global.yaml and the
# addons' default-environment files.
global:
  domain: civitas.test
  # Namespace and Keycloak realm.
  instanceSlug: dev
  # Gets NiFi admin policies; see `just create-admin-user`.
  initialUserEmail: admin@civitas.test
  profile: development
  serviceMesh:
    enable: false
  runtimePolicies:
    enabled: false
  ingress:
    clusterIssuer: selfsigned-ca
    ingressClass: nginx

kafka:
  cluster:
    productVersion: "4.2.1"

nifi:
  nifi:
    productVersion: "2.9.0"
    ingress:
      # NiFi UI at https://nifi.<domain>
      enabled: true
