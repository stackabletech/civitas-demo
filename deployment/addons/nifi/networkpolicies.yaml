---
# Who may talk to NiFi. Same apps as before, plus ingress-nginx for the web page.
nifi:
  podSelector:
    app.kubernetes.io/name: nifi
    app.kubernetes.io/instance: nifi-nifi
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
          componentNamespace: apisix
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: config-adapter
          componentNamespace: config-adapters
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nifi-bootstrap
          componentNamespace: nifi
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nifi
              app.kubernetes.io/instance: nifi-nifi
          componentNamespace: nifi
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
