---
# Copy of components/nifi/keycloak-clients.yaml from civitas-core-deployment.
# An addon replaces all files of a component, so the Keycloak clients live here too.

# Login for people in the browser.
nifi:
  name: NiFi
  description: CIVITAS Apache NiFi OIDC client (Authorization Code flow for web UI / REST API)
  subdomain: nifi
  redirectPath: /nifi-api/access/oidc/callback
  additionalRedirectPaths:
    - /nifi/logout-complete
  includePort443Variant: true
  rawValues:
    publicClient: false
    bearerOnly: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    authorizationServicesEnabled: false
    defaultClientScopes:
      - basic
      - email
      - profile
      - roles
    optionalClientScopes: []

# The two clients below are for programs, not people. NiFi takes the user name of a
# program from the token's `sub` field, so a mapper sets it to a fixed name.

# Used by config-adapter to create flows in NiFi.
nifi-config-adapter:
  name: NiFi Config Adapter
  description: >-
    CIVITAS NiFi client used by config-adapter to obtain a Keycloak token via
    the OAuth 2.0 client-credentials grant.
  subdomain: nifi-config-adapter
  redirectPath: /
  componentNamespaces:
    - configAdapters
  rawValues:
    publicClient: false
    bearerOnly: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    authorizationServicesEnabled: false
    redirectUris: []
    webOrigins: []
    defaultClientScopes:
      - basic
      - profile
      - roles
    optionalClientScopes: []
    protocolMappers:
      - name: nifi-sub-override
        protocol: openid-connect
        protocolMapper: oidc-hardcoded-claim-mapper
        consentRequired: false
        config:
          claim.name: sub
          claim.value: nifi-config-adapter
          jsonType.label: String
          access.token.claim: 'true'
          id.token.claim: 'false'
          userinfo.token.claim: 'false'
          introspection.token.claim: 'true'

# Used by the nifi-bootstrap Job. NiFi makes this name its first admin.
nifi-bootstrap:
  name: NiFi Bootstrap
  description: >-
    CIVITAS NiFi client used by the nifi-bootstrap Job to obtain a Keycloak
    token via the OAuth 2.0 client-credentials grant.
  subdomain: nifi-bootstrap
  redirectPath: /
  rawValues:
    publicClient: false
    bearerOnly: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    authorizationServicesEnabled: false
    redirectUris: []
    webOrigins: []
    defaultClientScopes:
      - basic
      - profile
      - roles
    optionalClientScopes: []
    protocolMappers:
      - name: nifi-sub-override
        protocol: openid-connect
        protocolMapper: oidc-hardcoded-claim-mapper
        consentRequired: false
        config:
          claim.name: sub
          claim.value: nifi-bootstrap
          jsonType.label: String
          access.token.claim: 'true'
          id.token.claim: 'false'
          userinfo.token.claim: 'false'
          introspection.token.claim: 'true'
