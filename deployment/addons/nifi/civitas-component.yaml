---
# Replaces the NiFi Helm chart of civitas-core-deployment with Stackable NiFi.
component: nifi
parts:
  - name: nifi
    timeout: 600
  - name: bootstrap
    timeout: 900
    needs:
      - nifi.nifi
    hooks:
      # NiFi needs a few minutes to start. Wait for it, so the Job does not give up.
      - events: ["presync"]
        showlogs: true
        command: kubectl
        args: ["-n", "{{ .Release.Namespace }}", "wait", "--for=condition=Available", "nificluster/nifi-nifi", "--timeout=900s"]
