{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "nifi-cluster.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    # NiFi's Jetty rejects requests whose SNI/Host is not in its certificate ("Invalid SNI").
    # The secret-operator certificate only covers in-cluster Service names, so talk to NiFi
    # with that name; NiFi builds external URLs from X-Forwarded-Host/-Proto instead.
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: {{ .Values.name }}-node.{{ .Release.Namespace }}.svc.cluster.local
    nginx.ingress.kubernetes.io/upstream-vhost: {{ .Values.name }}-node.{{ .Release.Namespace }}.svc.cluster.local
    nginx.ingress.kubernetes.io/affinity: cookie
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.name }}-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-node
                port:
                  name: https
{{- end }}
