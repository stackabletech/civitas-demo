---
# The kube-apiserver calls the operators' CRD conversion webhooks on :8443. It cannot be
# selected as a peer, so allow the port from anywhere (same as postgres-operator-webhook).
stackable-operator-webhooks:
  deployLayer: operators
  componentNamespace: stackable.commons
  podSelector:
    webhook.stackable.tech/conversion: enabled
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8443
