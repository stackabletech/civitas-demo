---
# Kubernetes itself calls the operators on port 8443. We cannot name Kubernetes
# as a sender, so this port is open for all (like postgres-operator-webhook).
stackable-operator-webhooks:
  deployLayer: operators
  componentNamespace: stackable.commons
  podSelector:
    webhook.stackable.tech/conversion: enabled
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8443
