---
# Who may talk to Kafka. Same apps as before, plus the Kafka pods themselves.
kafka-cluster:
  podSelector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka-cluster
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal
              app.kubernetes.io/component: backend
          componentNamespace: portal
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-ui
          componentNamespace: kafka
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: config-adapter
          componentNamespace: config-adapters
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nifi
          componentNamespace: nifi
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
              app.kubernetes.io/instance: kafka-cluster
          componentNamespace: kafka
