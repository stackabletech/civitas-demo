# A tiny MQTT broker and a sender with fake readings, for the demo pipeline.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-mqtt
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
  send.sh: |
    # Sends a fake reading every 5 seconds. The values mean nothing.
    while true; do
      n=$((RANDOM % 5 + 1))
      lat="51.9$((RANDOM % 900 + 100))"
      lon="7.6$((RANDOM % 900 + 100))"
      mosquitto_pub -h 127.0.0.1 -t demo/sensors \
        -m "{\"id\":\"sensor-$n\",\"name\":\"Demo sensor $n\",\"lat\":$lat,\"lon\":$lon}"
      sleep 5
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-mqtt
  labels:
    app.kubernetes.io/name: demo-mqtt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-mqtt
    spec:
      containers:
        - name: broker
          image: eclipse-mosquitto:2
          command: ["mosquitto", "-c", "/config/mosquitto.conf"]
          ports:
            - name: mqtt
              containerPort: 1883
          volumeMounts:
            - name: config
              mountPath: /config
        - name: sender
          image: eclipse-mosquitto:2
          command: ["sh", "/config/send.sh"]
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: demo-mqtt
---
apiVersion: v1
kind: Service
metadata:
  name: demo-mqtt
spec:
  selector:
    app.kubernetes.io/name: demo-mqtt
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
---
# All traffic in the namespace is blocked by default. Let NiFi reach the broker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-mqtt
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-mqtt
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nifi
      ports:
        - protocol: TCP
          port: 1883
